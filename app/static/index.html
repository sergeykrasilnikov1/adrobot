<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adrobot · Кампании</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header><div class="shell brand">Adrobot <span>Keitaro</span></div></header>
  <main class="shell">
    <h1>Кампании</h1>
    <p id="notice" role="status" hidden></p>
    <div class="layout">
      <section class="panel">
        <h2>Новая кампания</h2>
        <form id="create">
          <label>Название<input name="name" required maxlength="200"></label>
          <label>Код страны<input name="country" placeholder="AU" pattern="[A-Za-z]{2}" maxlength="2" required></label>
          <label>Оффер<select name="offer_id" required></select></label>
          <label>Домен<select name="domain_id" required></select></label>
          <label>Группа<select name="group_id" required></select></label>
          <label>Источник<select name="traffic_source_id" required></select></label>
          <button class="primary" type="submit">Создать кампанию</button>
        </form>
      </section>
      <section class="panel">
        <h2>Редактор кампании</h2>
        <form id="open">
          <label>Кампания<select id="campaigns"></select></label>
          <div class="actions"><button id="more" type="button" hidden>Ещё кампании</button></div>
          <label>Или ID кампании<input name="campaign" type="number" min="1" required></label>
          <button class="primary" type="submit">Загрузить потоки</button>
        </form>
      </section>
    </div>
    <section id="editor" class="panel" aria-live="polite" hidden></section>
  </main>
</body>
</html>
